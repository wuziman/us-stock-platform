version: "3.9"

services:
  backend:
    build:
      context: ..
      dockerfile: stock-platform/backend/Dockerfile
    container_name: stock-platform-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data
      - ./backend/stock_platform.db:/app/stock-platform/backend/stock_platform.db
    environment:
      - TZ=Asia/Shanghai

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stock-platform-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
